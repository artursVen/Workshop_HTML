<!DOCTYPE html>
<html lang="lv">

<head>

</head>

<body>

    <!DOCTYPE html>
<html lang="lv">

<head>
    <meta charset="UTF-8">
    <title>GET piemērs</title>
</head>

<body>

    <h1>Google meklēšana ar GET</h1>

    <form action="https://www.google.com/search" method="GET">

        <label for="search">Meklēt:</label>

        <input
            type="text"
            id="search"
            name="q"
            placeholder="Ievadi meklējamo tekstu"
            required
        >

        <button type="submit">
            Meklēt Google
        </button>

    </form>

</body>

</html>

</body>

</html>
